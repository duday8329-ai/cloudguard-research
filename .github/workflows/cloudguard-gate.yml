name: CloudGuard policy gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  cloudguard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run CloudGuard tests
        working-directory: outputs/cloudguard-research
        run: python -m unittest discover -s tests -v
      # Invoke this after the CI scan has produced a normalized JSON findings
      # file, for example: python scripts/deployment_gate.py findings.json --block-at HIGH
